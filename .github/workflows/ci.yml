name: CI · testes + imagem Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Testes de arquitetura (ArchUnitTS)
        run: npm run test:arch -- --reporter=verbose
      - name: Testes unitários
        run: npm run test:unit -- --reporter=verbose
      - run: npm run build

  docker:
    # publica no Docker Hub quando os segredos DOCKERHUB_USERNAME e DOCKERHUB_TOKEN existem no repositório
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudlog-frota-service:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudlog-frota-service:latest
